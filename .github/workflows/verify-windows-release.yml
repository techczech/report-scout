# Manual gate for the unsigned Windows build of ReportScout. Starts only when someone runs it by hand (workflow_dispatch):
# no push, pull request, schedule or release trigger. It reads the binary-only DRAFT release named in the inputs, checks the
# asset's SHA-256, then runs the packaged ReportScout.exe on a Windows runner with synthetic reports only.
name: Verify Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag of the temporary DRAFT release that holds the ZIP
        required: true
        type: string
      asset_name:
        description: Exact file name of the ZIP asset
        required: true
        type: string
      sha256:
        description: Expected SHA-256 of the ZIP (64 hex characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-windows-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # Only the checker script is fetched, at the commit this run was started from; the token is not left in the checkout.
      - name: Check out the checker
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: release-checks
          persist-credentials: false

      # The inputs reach the script only as environment variables, never inside the script text.
      - name: Run the Windows smoke check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RS_RELEASE_TAG: ${{ inputs.release_tag }}
          RS_ASSET_NAME: ${{ inputs.asset_name }}
          RS_SHA256: ${{ inputs.sha256 }}
          RS_EXPECTED_VERSION: "0.3.0"
        run: node release-checks/windows-smoke.mjs
